name: redis-to-dolist

services:
  proxy:
    image: nginx:alpine
    container_name: redis-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - front
      - front2
    networks:
      - redis-network

  redis:
    build:
      context: .
      dockerfile: Dockerfile
    image: aylenchiesa/redis-to-dolist:redis
    container_name: redis-server
    ports:
      - "6379:6379"
    networks:
      - redis-network

  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    image: aylenchiesa/redis-to-dolist:backend
    container_name: redis-backend
    ports:
      - "5001:5000"
    depends_on:
      - redis
    networks:
      - redis-network
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    image: aylenchiesa/redis-to-dolist:frontend
    container_name: redis-frontend
    ports:
      - "3001:3000"
    depends_on:
      - back
    networks:
      - redis-network
    environment:
      - INSTANCE_ID=01ABC

  front2:
    build:
      context: ./front
      dockerfile: Dockerfile
    image: aylenchiesa/redis-to-dolist:frontend
    container_name: redis-frontend2
    ports:
      - "3002:3000"
    depends_on:
      - back
    networks:
      - redis-network
    environment:
      - INSTANCE_ID=42XYZ

networks:
  redis-network:
    driver: bridge
